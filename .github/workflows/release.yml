name: アプリを作ってリリースに添付

# GitHub でリリースを公開すると、Windows 用の .exe を作って zip をリリースに添付する。
# 手動で実行（Actions タブ → Run workflow）した時は、zip を成果物（Artifacts）として保存する。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ビルド用のライブラリを入れる
        run: pip install numpy matplotlib pillow pyinstaller
      - name: リリースのタグとバージョン番号が合っているか確認
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $v = python -c "import rocketcalc; print(rocketcalc.__version__)"
          if ("${{ github.event.release.tag_name }}" -ne "v$v") {
            throw "タグ ${{ github.event.release.tag_name }} と rocketcalc/__init__.py の __version__ ($v) が違います"
          }
      - name: .exe を作って動作確認し、zip にする
        run: python build.py
      - name: zip をリリースに添付
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist/*.zip).FullName --clobber
      - name: zip を成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: RocketDesign-windows
          path: dist/*.zip
